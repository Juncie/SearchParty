<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>SearchParty ATS Fixture — Generic</title>
    <meta property="og:site_name" content="Fixture Corp" />
  </head>
  <body>
    <main>
      <h1>Senior Frontend Engineer</h1>
      <p class="location">Remote — United States</p>
      <section class="job-description">
        <p>
          Build calm, tactile product interfaces with React.
        </p>
      </section>
      <form aria-label="Application">
        <label>
          First name
          <input
            name="first_name"
            autocomplete="given-name"
          />
        </label>
        <label>
          Last name
          <input
            name="last_name"
            autocomplete="family-name"
          />
        </label>
        <label>
          Email
          <input
            name="email"
            type="email"
            autocomplete="email"
          />
        </label>
        <label>
          Desired salary
          <input name="desired_salary" />
        </label>
        <fieldset>
          <legend>
            Are you legally authorized to work in the US?
          </legend>
          <label
            ><input
              type="radio"
              name="work_auth"
              value="Yes"
            />
            Yes</label
          >
          <label
            ><input
              type="radio"
              name="work_auth"
              value="No"
            />
            No</label
          >
        </fieldset>
        <button type="submit">Submit application</button>
      </form>
    </main>
  </body>
</html>
